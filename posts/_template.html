<!DOCTYPE html>
<!-- ============================================
     新文章模板 —— 使用方法：
     1. 复制这个文件，改名为「英文短横线命名.html」
        （比如 my-first-day.html，不要用中文和空格）
     2. 修改下面的 <title>、日期、文章标题和正文
     3. 在 js/posts.js 的 POSTS 数组里加一条对应记录
     4. 用浏览器打开 ../index.html 检查效果
     ============================================ -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章标题 · 清茶小馆</title>
  <meta name="description" content="一句话摘要，会显示在搜索引擎结果里">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍵</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-name" href="../index.html">🍵 清茶小馆</a>
      <nav class="site-nav">
        <a href="../index.html">首页</a>
        <a href="https://github.com/MikeY5616" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="container post-page">
    <a class="back-link" href="../index.html">← 返回首页</a>

    <article>
      <header class="post-header">
        <time class="post-date" datetime="2026-10-05">2026 年 10 月 5 日</time>
        <h1>文章标题</h1>
      </header>

      <div class="post-body">
        <p>正文从这里开始。一个 &lt;p&gt; 标签就是一段。</p>
        <p>还可以用以下格式：</p>
        <h2>小标题</h2>
        <p>正文……</p>
        <blockquote>这是一段引用。</blockquote>
        <ul>
          <li>列表项一</li>
          <li>列表项二</li>
        </ul>
        <hr>
        <p class="post-end">—— Mike Tang，2026 年 10 月 5 日</p>
      </div>
    </article>

    <section class="comments">
      <h2 class="section-title">评论</h2>
      <script src="https://giscus.app/client.js"
              data-repo="MikeY5616/MikeY5616.github.io"
              data-repo-id="R_kgDOU8Pd_g"
              data-category="General"
              data-category-id="DIC_kwDOU8Pd_s4DHE7z"
              data-mapping="pathname"
              data-strict="0"
              data-reactions-enabled="1"
              data-emit-metadata="0"
              data-input-position="top"
              data-theme="light"
              data-lang="zh-CN"
              crossorigin="anonymous"
              async>
      </script>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Mike Tang · 托管于 <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a></p>
    </div>
  </footer>
</body>
</html>
